[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckflow-core"
version = "0.3.0"
description = "Deckflow capability broker: one CLI and one result envelope over deckflow-extract, with on-demand provider acquisition."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["deckflow", "presentation", "html", "cli", "extraction", "parsing"]
authors = [{ name = "DeckFlow Contributors" }]

# Zero third-party dependencies is a hard constraint, not a preference: it is
# what makes the package vendorable into a Skill and installable with
# `pip install --target` on a PEP 668 externally-managed interpreter.
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/deckflow/deckflow-core"
Repository = "https://github.com/deckflow/deckflow-core"
Issues = "https://github.com/deckflow/deckflow-core/issues"
Changelog = "https://github.com/deckflow/deckflow-core/releases"

[project.scripts]
deckflow = "deckflow_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deckflow_core"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "launcher", "README.md", "LICENSE", "pyproject.toml"]
