name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. Core is pure standard library,
        # so the interesting risk is a stdlib behaviour change, not a
        # dependency conflict.
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Refuse third-party dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Zero dependencies is what makes this package vendorable into a
          # Skill and installable with `pip install --target`. Enforce it
          # rather than trusting review.
          declared=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(len(data['project'].get('dependencies', [])))
          ")
          if [ "$declared" != "0" ]; then
            echo "::error::deckflow-core declares $declared runtime dependencies; it must declare none"
            exit 1
          fi

      - name: Run the test suite
        shell: bash
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v

      - name: Build and install into a clean directory
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build
          python -m pip install --target "${RUNNER_TEMP}/smoke" --no-input dist/*.whl
          PYTHONPATH="${RUNNER_TEMP}/smoke" python -m deckflow_core --version
          # Listing providers has no side effects, so it is a safe smoke test
          # even on a runner with no providers installed.
          PYTHONPATH="${RUNNER_TEMP}/smoke" python -m deckflow_core providers --json > /dev/null
          PYTHONPATH="${RUNNER_TEMP}/smoke" python -c "
          from deckflow_core import schemas_dir
          assert (schemas_dir() / 'envelope.schema.json').is_file(), 'schemas missing from the wheel'
          print('schemas ship with the wheel')
          "
